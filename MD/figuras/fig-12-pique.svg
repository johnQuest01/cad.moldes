  <text x="-17920" y="262405.912" font-size="3806.3999999999996" fill="#d1242f" font-family="ui-monospace, monospace">— linha de corte (margem 10 mm)</text>
    <text x="-17920" y="267925.19200000004" font-size="3806.3999999999996" fill="#1f6feb" font-family="ui-monospace, monospace">— linha de costura (o pique e ancorado aqui)</text>
    <text x="-17920" y="273444.472" font-size="3806.3999999999996" fill="#d0d7de" font-family="ui-monospace, monospace">— projecao perpendicular costura -> corte</text>
    <text x="-17920" y="278963.75200000004" font-size="3806.3999999999996" fill="#8250df" font-family="ui-monospace, monospace">— pique V, cortado na linha de CORTE</text>
  <text x="-17920" y="287794.60000000003" font-size="3349.6319999999996" fill="#1f2328" font-family="ui-monospace, monospace">clique em (103, 150) mm -> aresta "ar-1", s = 0.750000, a 3 mm do contorno</text>
    <text x="-17920" y="293313.88000000006" font-size="3349.6319999999996" fill="#1f2328" font-family="ui-monospace, monospace">a projecao anda 10, 10, 10 mm — exatamente a margem da aresta</text>
    <text x="-17920" y="298833.16000000003" font-size="3349.6319999999996" fill="#1f2328" font-family="ui-monospace, monospace">s nao muda com o tamanho: P: s = 0.7500 | M: s = 0.7500 | G: s = 0.7500 — o que muda e a coordenada</text>
    <text x="-17920" y="304352.44000000006" font-size="3349.6319999999996" fill="#1f2328" font-family="ui-monospace, monospace">dimensao real do notcher: 6,35 x 1,59 mm; o V da figura esta com 5 mm de boca para ser visivel</text>
